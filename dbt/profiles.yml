pizzaria:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', '127.0.0.1') }}"
      port: "{{ env_var('PGPORT', '5433') | int }}"
      user: "{{ env_var('PGUSER', 'estudante') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'pizzaria') }}"
      schema: dbt
      threads: 2
      connect_timeout: 10

