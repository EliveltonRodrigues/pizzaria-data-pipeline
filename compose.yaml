name: pizzaria-treino
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PGDATABASE:?Configure o arquivo .env}
      POSTGRES_USER: ${PGUSER:?Configure o arquivo .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Configure o arquivo .env}
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:

